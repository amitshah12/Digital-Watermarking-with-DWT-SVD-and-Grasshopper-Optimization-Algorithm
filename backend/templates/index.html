<!DOCTYPE html>
<html>
<head>
    <title>Digital Watermarking System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .section {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="file"],
        input[type="number"] {
            width: 100%;
            padding: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .result-container {
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .result-image {
            max-width: 100%;
            margin: 10px 0;
        }

        .metrics {
            margin-top: 15px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 4px;
            font-size: 0.9em;
            text-align: left;
        }

        .metrics h4 {
            margin-bottom: 10px;
            color: #333;
        }

        .metrics p {
            margin: 5px 0;
            color: #666;
        }

        .alpha-value {
            display: inline-block;
            padding: 5px 10px;
            background: #e3f2fd;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: bold;
            color: #1976d2;
        }

        .error {
            color: #f44336;
            background: #ffebee;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .image-preview {
            margin-top: 10px;
            max-width: 100%;
            max-height: 200px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: none;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Digital Watermarking System</h1>

    <div class="container">

        <!-- ========================================= -->
        <!-- EMBED WATERMARK SECTION -->
        <!-- ========================================= -->

        <div class="section">

            <h2>Embed Watermark</h2>

            <form id="embedForm"
                  onsubmit="embedWatermark(event)">

                <div class="form-group">

                    <label for="coverImage">
                        Cover Image:
                    </label>

                    <input
                        type="file"
                        id="coverImage"
                        name="cover"
                        accept="image/*"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="watermarkImage">
                        Watermark Image:
                    </label>

                    <input
                        type="file"
                        id="watermarkImage"
                        name="watermark"
                        accept="image/*"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn"
                    id="embedBtn"
                >
                    Embed Watermark
                </button>

                <div
                    id="embedError"
                    class="error"
                ></div>

            </form>


            <!-- EMBEDDING RESULT -->

            <div
                class="result-container"
                id="embedResult"
            >

                <h3>Result</h3>

                <img
                    id="watermarkedImage"
                    class="result-image"
                    alt="Watermarked image"
                >

                <div
                    id="alphaValue"
                    class="alpha-value"
                ></div>

                <button
                    class="btn"
                    onclick="downloadImage(
                        'watermarkedImage',
                        'watermarked_image.png'
                    )"
                >
                    Download
                </button>

            </div>

        </div>


        <!-- ========================================= -->
        <!-- EXTRACT WATERMARK SECTION -->
        <!-- ========================================= -->

        <div class="section">

            <h2>Extract Watermark</h2>

            <form
                id="extractForm"
                onsubmit="extractWatermark(event)"
            >

                <div class="form-group">

                    <label for="watermarkedImageInput">
                        Watermarked Image:
                    </label>

                    <input
                        type="file"
                        id="watermarkedImageInput"
                        name="watermarked"
                        accept="image/*"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="originalImageInput">
                        Original Cover Image:
                    </label>

                    <input
                        type="file"
                        id="originalImageInput"
                        name="original"
                        accept="image/*"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="alphaInput">
                        Alpha Value:
                    </label>

                    <input
                        type="number"
                        id="alphaInput"
                        name="alpha"
                        step="0.01"
                        min="0.01"
                        max="1.00"
                        value="0.10"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                    id="extractBtn"
                >
                    Extract Watermark
                </button>

                <div
                    id="extractError"
                    class="error"
                ></div>

            </form>


            <!-- EXTRACTION RESULT -->

            <div
                class="result-container"
                id="extractResult"
            >

                <h3>Result</h3>

                <img
                    id="extractedImage"
                    class="result-image"
                    alt="Extracted watermark"
                >

                <button
                    class="btn"
                    onclick="downloadImage(
                        'extractedImage',
                        'extracted_watermark.png'
                    )"
                >
                    Download
                </button>

            </div>

        </div>

    </div>


    <script>

        // ============================================
        // EMBED WATERMARK
        // ============================================

        async function embedWatermark(event) {

            event.preventDefault();

            const form = event.target;

            const formData = new FormData(form);

            const submitButton =
                document.getElementById('embedBtn');

            const errorDiv =
                document.getElementById('embedError');

            const resultDiv =
                document.getElementById('embedResult');


            // Reset previous error

            errorDiv.textContent = '';
            errorDiv.style.display = 'none';

            resultDiv.style.display = 'none';

            submitButton.disabled = true;


            try {

                const response = await fetch(
                    '/embed',
                    {
                        method: 'POST',
                        body: formData
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        'Error processing image'
                    );

                }


                if (data.success && data.image) {

                    // --------------------------------
                    // Display watermarked image
                    // --------------------------------

                    document.getElementById(
                        'watermarkedImage'
                    ).src = data.image;


                    // --------------------------------
                    // Process alpha
                    // --------------------------------

                    let alpha = 0.10;


                    if (
                        data.alpha !== undefined &&
                        data.alpha !== null &&
                        !isNaN(data.alpha)
                    ) {

                        alpha = Number(data.alpha);

                    }


                    // Force alpha to 2 decimal places

                    alpha = Number(alpha.toFixed(2));


                    // --------------------------------
                    // Display alpha
                    // --------------------------------

                    document.getElementById(
                        'alphaValue'
                    ).textContent =
                        `Alpha: ${alpha.toFixed(2)}`;


                    // --------------------------------
                    // Automatically set extraction alpha
                    // --------------------------------

                    document.getElementById(
                        'alphaInput'
                    ).value =
                        alpha.toFixed(2);


                    // Show result

                    resultDiv.style.display = 'block';

                }

            }

            catch (error) {

                errorDiv.textContent =
                    error.message ||
                    'Error processing image';

                errorDiv.style.display = 'block';

            }

            finally {

                submitButton.disabled = false;

            }

        }



        // ============================================
        // EXTRACT WATERMARK
        // ============================================

        async function extractWatermark(event) {

            event.preventDefault();

            const form = event.target;

            const formData = new FormData(form);

            const submitButton =
                document.getElementById('extractBtn');

            const errorDiv =
                document.getElementById('extractError');

            const resultDiv =
                document.getElementById('extractResult');


            // Reset previous error

            errorDiv.textContent = '';
            errorDiv.style.display = 'none';

            resultDiv.style.display = 'none';

            submitButton.disabled = true;


            try {

                const response = await fetch(
                    '/extract',
                    {
                        method: 'POST',
                        body: formData
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        'Error extracting watermark'
                    );

                }


                if (data.success && data.image) {

                    document.getElementById(
                        'extractedImage'
                    ).src = data.image;


                    resultDiv.style.display =
                        'block';

                }

            }

            catch (error) {

                errorDiv.textContent =
                    error.message ||
                    'Error extracting watermark';

                errorDiv.style.display = 'block';

            }

            finally {

                submitButton.disabled = false;

            }

        }



        // ============================================
        // DOWNLOAD IMAGE
        // ============================================

        function downloadImage(imageId, filename) {

            const img =
                document.getElementById(imageId);


            if (img && img.src) {

                const link =
                    document.createElement('a');


                link.href = img.src;

                link.download = filename;

                link.click();

            }

        }

    </script>

</body>
</html>
